services:
  jellyfin:
    image: jellyfin/jellyfin:12.0.0
    container_name: jellyfin-edl-dev
    environment:
      - JELLYFIN_PublishedServerUrl=http://localhost:8096
    ports:
      - "8096:8096"
    volumes:
      - ./dev/jellyfin/config:/config
      - ./dev/jellyfin/cache:/cache
      - ./dev/media:/media:ro
      - ./artifacts/plugins/Jellyfin.Plugin.Edl:/config/plugins/Jellyfin.Plugin.Edl
    restart: unless-stopped
